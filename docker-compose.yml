services:
  slaveryandfreedomlaws-lib-unb-ca:
    build:
      context: .
    container_name: slaveryandfreedomlaws-lib-unb-ca
    restart: unless-stopped
    depends_on:
      - drupal-mysql-lib-unb-ca
      - drupal-solr-lib-unb-ca
      - drupal-redis-lib-unb-ca
    expose:
      - "80"
    networks:
      - slaveryandfreedomlaws.lib.unb.ca
    ports:
      - "3111:80"
    env_file:
      - ./env/drupal.env
      - ./env/mysql.env
    volumes:
      - drupal-data:/app/html/sites/default
      - ./configuration:/app/configuration
      - ./custom/modules:/app/html/modules/custom
      - ./custom/themes:/app/html/themes/custom
  drupal-mysql-lib-unb-ca:
    image: public.ecr.aws/docker/library/mariadb:12.0
    command:
      - mariadbd
      - --skip-name-resolve
      - --max_allowed_packet=64M
    restart: unless-stopped
    env_file:
      - ./env/mysql.env
    expose:
      - "3306"
    networks:
      - slaveryandfreedomlaws.lib.unb.ca
    volumes:
      - mysql-data:/var/lib/mysql
  drupal-redis-lib-unb-ca:
    image: public.ecr.aws/docker/library/redis:8.2-alpine
    command:
      - redis-server
      - --maxmemory-policy allkeys-lru
      - --maxmemory 128mb
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - slaveryandfreedomlaws.lib.unb.ca
    env_file:
      - ./env/redis.env
  drupal-solr-lib-unb-ca:
    image: ghcr.io/unb-libraries/solr-drupal:9.x-11.x
    restart: unless-stopped
    env_file:
      - ./env/solr.env
    expose:
      - "8983"
    networks:
      - slaveryandfreedomlaws.lib.unb.ca
    entrypoint:
      - /scripts/docker-entrypoint-multiple.sh
      - aaslp.lib.unb.ca:/solr-conf
    volumes:
      - solr-data:/var/solr/data  
  mailhog:
    image: public.ecr.aws/alekitto/mailhog:latest
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"
    ports:
      - "4111:8025"
    networks:
      - slaveryandfreedomlaws.lib.unb.ca
    profiles:
      - mailhog
  cypress:
    image: ghcr.io/unb-libraries/einbaum/drupal:12.x-1.x
    depends_on:
      - slaveryandfreedomlaws-lib-unb-ca
    environment:
      - BASE_URL=http://slaveryandfreedomlaws.lib.unb.ca
    volumes:
      - ./tests/einbaum/e2e:/einbaum/e2e
      - ./tests/einbaum/fixtures:/einbaum/fixtures
    networks:
      - slaveryandfreedomlaws.lib.unb.ca
networks:
  slaveryandfreedomlaws.lib.unb.ca:
    name: slaveryandfreedomlaws.lib.unb.ca
volumes:
  drupal-data:
  mysql-data:
  solr-data: